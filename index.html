      </div>
      
      <div class="results-container">
        <div class="result-card" data-type="grw">
          <input type="hidden" name="grw">
          <img id="grwi" src="colorbottle9/0.png" alt="Growth Color">

        </div>
        <div class="result-card" data-type="dstn">
